<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Sounds Of Terror</title>
    <div class="heading">
        <h2 class="logo">Sounds Of</h2>
        <h1 class="logo2 glitch" data-text="Terror">Terror</h1>
    </div>
    <div class="options">
        <div class="menubtns" style="display:none">Continue</div>
        <div class="menubtns">start</div>

    </div>
    <style>
    html, body { 
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }
    * {
  margin: 0;
  padding: 0; 
  box-sizing: border-box; 
}
.heading {
  position: fixed;
  top: 150px;
  left: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  z-index: 10;
  pointer-events: none;
}
.logo {
  color: #f03c63;
  font-size: clamp(4rem, 3vw, 4rem);
  font-family: "BBH Bogle", sans-serif;
  line-height: 1;
}
.glitch {
  position: relative;
  color: #ffffff;
  font-size: clamp(6rem, 5vw, 6rem);
  font-family: "BBH Bogle", sans-serif;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 1;
  user-select: none;
}
  canvas { 
    display: block;
    width: 100vw;
    height: 100vh;
    }

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  inset: 0;
  opacity: 0.85;
}
.glitch::before {
  color: #ff004c;
  animation: glitch-1 1.5s infinite linear alternate-reverse;
}
.glitch::after {
  color: #003cff;
  animation: glitch-2 0.6s infinite linear alternate-reverse;
}
@keyframes glitch-1 {
  0%, 80%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  82% { clip-path: inset(15% 0 65% 0); transform: translate(4px, 1px); }
  86% { clip-path: inset(55% 0 20% 0); transform: translate(4px, 1px); }
  90% { clip-path: inset(30% 0 50% 0); transform: translate(3px, 0); }
  94% { clip-path: inset(75% 0 5% 0);  transform: translate(5px, 1px); }
}
@keyframes glitch-2 {
  0%, 75%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
  78% { clip-path: inset(60% 0 15% 0); transform: translate(4px, 1px); }
  84% { clip-path: inset(10% 0 70% 0); transform: translate(-5px, -1px); }
  91% { clip-path: inset(40% 0 35% 0); transform: translate(3px, 0); }
  96% { clip-path: inset(80% 0 5% 0);  transform: translate(-4px, 1px); }
} 
    </style>
